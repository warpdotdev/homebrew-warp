name: Update channel versions

on: pull_request

permissions:
  pull-requests: write

jobs:
  # Adapted from https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#automatically-approving-a-pull-request
  merge-version-update:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'warpdotdev/homebrew-warp' &&
      contains(fromJSON('["warpmachineuser", "warp-workflows[bot]"]'), github.event.pull_request.user.login)
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # GITHUB_TOKEN approves because a PR author cannot approve its own PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mint auto-merge token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WARP_WORKFLOWS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARP_WORKFLOWS_APP_PRIVATE_KEY }}
          owner: warpdotdev
          repositories: homebrew-warp
          permission-contents: write
          permission-pull-requests: write
      - name: Enable automerge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The app token turns on auto-merge because GITHUB_TOKEN cannot.
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
