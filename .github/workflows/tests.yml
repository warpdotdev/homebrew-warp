name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  generate-matrix:
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
      
      - name: Generate CI matrix
        id: generate-matrix
        env:
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            brew generate-cask-ci-matrix --casks oz oz@preview warp-agent-cli
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            brew generate-cask-ci-matrix --syntax-only
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # `generate-cask-ci-matrix --url` odie's outright if the diff touches any .rb file
            # outside Casks/, cmd/ or .github/actions/ (e.g. our Formula/ files), so only use it
            # when the PR actually touches a cask; otherwise fall back to --syntax-only, which
            # skips that check entirely and just runs the tap-wide syntax/style job.
            changed_files=$(git diff --name-only "$(git rev-parse origin)...$(git rev-parse HEAD)")
            if echo "$changed_files" | grep -q '^Casks/' && echo "$changed_files" | grep -q '^Formula/'; then
              echo "::error::This PR modifies both Casks/ and Formula/ files. brew generate-cask-ci-matrix can't process a mixed diff (it treats any changed Formula/*.rb file as misplaced). Please split cask and formula changes into separate PRs."
              exit 1
            elif echo "$changed_files" | grep -q '^Casks/'; then
              brew generate-cask-ci-matrix --url "$PULL_REQUEST_URL"
            else
              brew generate-cask-ci-matrix --syntax-only
            fi
          else
            echo "::error file=.github/workflows/tests.yml::Unsupported event ${GITHUB_EVENT_NAME}"
            exit 1
          fi
  
  test:
    name: ${{ matrix.name }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up CI machine
        run: brew test-bot --only-cleanup-before
      
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-
      
      - name: Cache style cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/style
          key: macos-style-cache-${{ github.sha }}
          restore-keys: macos-style-cache-

      - run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --tap '${{ matrix.tap }}' --only-tap-syntax
        id: tap-syntax
        if: always() && !matrix.cask
      
      - name: Run brew fetch --cask ${{ matrix.cask.token }}
        id: fetch
        run: brew fetch --cask --retry --force ${{ join(matrix.fetch_args, ' ') }} '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && matrix.cask
        
      - name: Run brew audit --cask${{ (matrix.cask && ' ') || ' --tap ' }}${{ matrix.cask.token || matrix.tap }}
        id: audit
        run: brew audit --cask ${{ join(matrix.audit_args, ' ') }}${{ (matrix.cask && ' ') || '--tap ' }}'${{ matrix.cask && format('{0}/{1}', matrix.tap, matrix.cask.token) || matrix.tap }}'
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          (!matrix.cask || steps.fetch.outcome == 'success') &&
          !matrix.skip_audit

      - name: Run brew uninstall --cask --force --zap ${{ matrix.cask.token }}
        run: brew uninstall --cask --force --zap '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && matrix.cask
      
      - name: Run brew install --cask ${{ matrix.cask.token }}
        id: install
        run: brew install --cask '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && matrix.cask && !matrix.skip_install
        
      - name: Run brew uninstall --cask ${{ matrix.cask.token }}
        run: brew uninstall --cask '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && steps.install.outcome == 'success'

  test-formula:
    name: test-formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: namespace-profile-mac-ci
          - os: ubuntu-latest
            # Homebrew's Linux sandbox needs Landlock, which isn't enabled on Namespace runners
            # by default; the `;linux.landlock=enabled` suffix turns it on for this profile.
            runner: namespace-profile-ubuntu-small;linux.landlock=enabled
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up CI machine
        run: brew test-bot --only-cleanup-before

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Cache style cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/style
          key: macos-style-cache-${{ github.sha }}
          restore-keys: macos-style-cache-

      - run: brew test-bot --only-setup

      # `--only-formulae` self-detects whichever formula changed in this tap (via git diff)
      # and runs audit, install, test and bottling for it; it's a no-op if none changed.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_test-formula_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: ignore

  # `main` is protected by a ruleset requiring every change go through a PR.
  # `brew pr-pull`'s standard model (merge a bottle commit, then `git push` straight to `main`)
  # is not compatible with this. So instead of relying on `publish.yml` to bottle formulae,
  # push the bottle commit back onto the PR's own branch here, using `brew pr-upload`
  # to both upload the bottle binaries and merge their hashes into the formula in one atomic
  # step (avoiding ever mixing hashes from separate, non-reproducible builds). The PR then
  # merges through the normal GitHub PR flow.
  commit-bottle:
    name: commit-bottle
    needs: test-formula
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.test-formula.result == 'success'
    runs-on: namespace-profile-ubuntu-small
    permissions:
      actions: read
      contents: write
    steps:
      # A push authenticated as the default GITHUB_TOKEN is attributed to the `github-actions[bot]`
      # identity, which this repo's workflow-approval policy treats like an unrecognized/first-time
      # contributor - the resulting `pull_request: synchronize` run then sits stuck needing a human
      # to click "Approve and run", even though this isn't a fork PR. Using a PAT attributes
      # the push to a trusted collaborator identity instead, so the retriggered run executes
      # automatically like any other trusted push.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_PAT }}

      # `git-user-config`'s `username` input defaults to `github.actor` (whoever triggered *this*
      # run), not the identity behind the token above. That would mean we can't identify bot-pushed
      # bottle commits. Instead, we resolve the login of the HOMEBREW_TAP_PAT token.
      - name: Resolve PAT identity
        id: pat-identity
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: echo "login=$(gh api user --jq .login)" >> "$GITHUB_OUTPUT"

      - name: Set up git
        id: set-up-git
        uses: Homebrew/actions/git-user-config@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          username: ${{ steps.pat-identity.outputs.login }}

      - name: Check out PR branch in tap
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          tap_dir="$(brew --repository "${GITHUB_REPOSITORY}")"
          cd "${tap_dir}"
          git fetch origin "pull/${PR}/head:${HEAD_REF}"
          git checkout "${HEAD_REF}"

      - name: Download bottle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottles_test-formula_*
          path: bottle-artifacts
          merge-multiple: true

      - name: Check whether there's anything new to publish
        id: check-bottled
        env:
          # The exact email `git-user-config` just resolved and configured above - not a
          # hardcoded guess at the noreply-email format, which would break if this identity's
          # GitHub profile ever set (or unset) a public email address.
          BOT_EMAIL: ${{ steps.set-up-git.outputs.email }}
        run: |
          shopt -s nullglob
          json_files=(bottle-artifacts/*.bottle.json)
          if [ ${#json_files[@]} -eq 0 ]; then
            echo "No bottle JSON manifests found; nothing to publish."
            echo "already_bottled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pushing a bottle commit onto the PR branch re-triggers `pull_request: synchronize`.
          # We previously guarded this by comparing bottle checksums, but Go builds aren't
          # reproducible: a fresh rebuild of *identical* source always produces different bytes,
          # so that comparison never matched and this job looped forever (rebuild -> new hash ->
          # "nothing matches" -> commit -> retrigger -> ...). Instead, check whether HEAD was
          # already committed by this same automation, identified by its committer email. If so,
          # there's nothing new to do. Any genuine new human commit changes HEAD's committer away
          # from this identity, correctly triggering a rebuild even if that commit didn't touch
          # the bottle block itself.
          tap_dir="$(brew --repository "${GITHUB_REPOSITORY}")"
          committer_email="$(git -C "${tap_dir}" log -1 --format=%ce)"
          if [[ "${committer_email}" == "${BOT_EMAIL}" ]]; then
            echo "HEAD is already a commit from this automation; nothing more to do."
            echo "already_bottled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear any stale bottle release from earlier PR iterations
        if: steps.check-bottled.outputs.already_bottled != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          # Bottle binaries aren't reproducible, so re-running this job for the same PR/version
          # (e.g. after a force-push that doesn't change the formula, or a retriggered run) would
          # produce different bytes than a previous run's, but `pr-upload` tries to publish them
          # under the same already-claimed release-asset filename, which GitHub rejects with a
          # "ReleaseAsset already_exists" error. Delete any such stale release first so the
          # upload below always starts from a clean slate.
          tags=$(jq -r '.[].bottle.root_url' bottle-artifacts/*.bottle.json | sed -E 's#.*/releases/download/##' | sort -u)
          for tag in $tags; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Deleting stale release $tag from an earlier PR iteration"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done

      - name: Upload bottles and merge hashes into formula
        if: steps.check-bottled.outputs.already_bottled != 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          cd bottle-artifacts
          brew pr-upload --verbose

      - name: Push bottle commit onto the PR branch
        if: steps.check-bottled.outputs.already_bottled != 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          tap_dir="$(brew --repository "${GITHUB_REPOSITORY}")"
          cd "${tap_dir}"
          git push origin "HEAD:${HEAD_REF}"

  # This job aggregates the results of all the different checks in the CI matrix, regardless of which
  # ones a particular PR needs.
  aggregate-results:
    name: aggregate-results
    needs: [test, test-formula]
    runs-on: namespace-profile-ubuntu-small
    if: always()
    steps:
      - name: Check test results
        run: ${{ needs.test.result == 'success' && needs['test-formula'].result == 'success' }}
